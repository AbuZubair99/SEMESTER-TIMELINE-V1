<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semester Timeline</title>
  
  <!-- Google Fonts: Orbitron & Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #191919;
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      width: min(90%, 320px);
      padding: 30px 0;
    }

    /* Judul dengan glow tipis */
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.4rem, 3.5vw, 2.2rem);
      font-weight: 800;
      letter-spacing: 3px;
      line-height: 1.2;
      margin-bottom: 25px;
      color: #ffffff;
      text-shadow: 0 0 6px rgba(255, 166, 0, 0.35); /* Glow diperkecil */
      align-self: flex-start;
      padding-left: 0;
      margin-left: 0;
    }

    .circle-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .circle-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
    }

    .circle-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
    }

    .circle-bg {
      fill: none;
      stroke: #2a2a2a;
      stroke-width: 6;
    }

    /* Progress bar melingkar dengan glow yang diperkecil (9px -> 4px) */
    .circle-progress {
      fill: none;
      stroke: #ffa600;
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s linear;
      filter: drop-shadow(0 0 4px rgba(255, 166, 0, 0.75)); /* Radius glow diperkecil */
    }

    .number-container {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Angka persentase dengan glow lebih tipis */
    .number {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 4.8vw, 2.8rem);
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 5px rgba(255, 166, 0, 0.4); /* Glow diperkecil */
      line-height: 1;
    }

    .sub-number {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.6rem, 1.4vw, 0.75rem);
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 1.5px;
      margin-top: 8px;
      text-transform: uppercase;
      text-shadow: 0 0 4px rgba(255, 166, 0, 0.3); /* Glow diperkecil */
    }

    .label {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.75rem, 1.4vw, 0.95rem);
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      text-shadow: 0 0 4px rgba(255, 166, 0, 0.3); /* Glow diperkecil */
    }

    .label-box {
      width: 10px;
      height: 10px;
      background-color: #ffa600;
      border-radius: 2px;
      box-shadow: 0 0 4px rgba(255, 166, 0, 0.6); /* Glow kotak diperkecil */
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">SEMESTER<br>TIMELINE</h1>
    
    <div class="circle-item">
      <div class="circle-wrapper">
        <svg class="circle-svg" viewBox="0 0 100 100">
          <circle class="circle-bg" cx="50" cy="50" r="40"></circle>
          <circle class="circle-progress" id="ring-semester" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="251.3"></circle>
        </svg>
        <div class="number-container">
          <span class="number" id="percent-text">0,00%</span>
          <span class="sub-number">Total Progress</span>
        </div>
      </div>
      
      <div class="label">
        <span class="label-box"></span>
        <span>SEMESTER 1</span>
      </div>
    </div>
  </div>

  <script>
    const startDate = new Date("2026-06-01T00:00:00+07:00").getTime();
    const endDate = new Date("2027-01-06T00:00:00+07:00").getTime();
    const circumference = 2 * Math.PI * 40;

    function updateSemesterProgress() {
      const now = new Date().getTime();
      const totalDuration = endDate - startDate;
      const elapsedTime = now - startDate;

      let percentage = (elapsedTime / totalDuration) * 100;

      if (percentage < 0) percentage = 0;
      if (percentage > 100) percentage = 100;

      const formattedPercent = percentage.toFixed(2).replace('.', ',');
      document.getElementById("percent-text").innerText = `${formattedPercent}%`;

      const circle = document.getElementById("ring-semester");
      if (circle) {
        const offset = circumference - (percentage / 100) * circumference;
        circle.style.strokeDashoffset = offset;
      }
    }

    setInterval(updateSemesterProgress, 1000);
    updateSemesterProgress();
  </script>
</body>
</html>
