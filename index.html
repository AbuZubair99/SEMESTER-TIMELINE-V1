<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semester Timeline</title>
  
  <!-- Google Fonts: Orbitron & Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #191919;
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Container utama menggunakan Grid agar pembagian ruang vertikal lebih stabil */
    .container {
      display: grid;
      grid-template-rows: auto 1fr auto;
      justify-items: center;
      align-items: center;
      width: 100%;
      height: 100vh;
      max-height: 100vh;
      padding: 12px;
      gap: 8px;
      overflow: hidden;
      container-type: size; /* Memicu container query berbasis tinggi & lebar */
    }

    /* Judul rata kiri */
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.75rem, 5cqw, 1.5rem);
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1.1;
      color: #ffffff;
      text-shadow: 0 0 6px rgba(255, 166, 0, 0.35);
      justify-self: start;
      width: 100%;
    }

    .circle-item {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      min-height: 0; /* Mengunci agar tidak membesar melebihi area grid */
    }

    /* Kunci Perbaikan: Lingkaran dikunci berbasis nilai terkecil antara lebar (cqw) dan tinggi (cqh) */
    .circle-wrapper {
      position: relative;
      width: min(65cqw, 55cqh);
      height: min(65cqw, 55cqh);
      max-width: 240px;
      max-height: 240px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .circle-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
    }

    .circle-bg {
      fill: none;
      stroke: #2a2a2a;
      stroke-width: 6;
    }

    .circle-progress {
      fill: none;
      stroke: #ffa600;
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s linear;
      filter: drop-shadow(0 0 4px rgba(255, 166, 0, 0.75));
    }

    .number-container {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 80%;
    }

    /* Ukuran teks dinamis mengikuti skala container */
    .number {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.85rem, 12cqw, 2.2rem);
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 5px rgba(255, 166, 0, 0.4);
      line-height: 1;
    }

    .sub-number {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.4rem, 3cqw, 0.7rem);
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 1px;
      margin-top: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 4px rgba(255, 166, 0, 0.3);
      white-space: nowrap;
    }

    .label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.5rem, 3.5cqw, 0.85rem);
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 4px rgba(255, 166, 0, 0.3);
    }

    .label-box {
      width: clamp(5px, 2cqw, 8px);
      height: clamp(5px, 2cqw, 8px);
      background-color: #ffa600;
      border-radius: 2px;
      box-shadow: 0 0 4px rgba(255, 166, 0, 0.6);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">SEMESTER<br>TRACKER</h1>
    
    <div class="circle-item">
      <div class="circle-wrapper">
        <svg class="circle-svg" viewBox="0 0 100 100">
          <circle class="circle-bg" cx="50" cy="50" r="40"></circle>
          <circle class="circle-progress" id="ring-semester" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="251.3"></circle>
        </svg>
        <div class="number-container">
          <span class="number" id="percent-text">0,00%</span>
          <span class="sub-number">Total Progress</span>
        </div>
      </div>
    </div>

    <div class="label">
      <span class="label-box"></span>
      <span>SEMESTER 1</span>
    </div>
  </div>

  <script>
    const startDate = new Date("2026-06-01T00:00:00+07:00").getTime();
    const endDate = new Date("2027-01-06T00:00:00+07:00").getTime();
    const circumference = 2 * Math.PI * 40;

    function updateSemesterProgress() {
      const now = new Date().getTime();
      const totalDuration = endDate - startDate;
      const elapsedTime = now - startDate;

      let percentage = (elapsedTime / totalDuration) * 100;

      if (percentage < 0) percentage = 0;
      if (percentage > 100) percentage = 100;

      const formattedPercent = percentage.toFixed(2).replace('.', ',');
      document.getElementById("percent-text").innerText = `${formattedPercent}%`;

      const circle = document.getElementById("ring-semester");
      if (circle) {
        const offset = circumference - (percentage / 100) * circumference;
        circle.style.strokeDashoffset = offset;
      }
    }

    setInterval(updateSemesterProgress, 1000);
    updateSemesterProgress();
  </script>
</body>
</html>
